log_diaper_change:
  name: Log Diaper Change
  description: Log a diaper change event to Napper
  fields:
    diaper_content:
      name: Diaper Content
      description: Type of diaper content
      required: true
      selector:
        select:
          options:
            - label: Wet
              value: WET
            - label: Mixed
              value: MIXED
            - label: Poop
              value: POOP
    comment:
      name: Comment
      description: Optional note about the diaper change
      required: false
      selector:
        text:
    timestamp:
      name: Timestamp
      description: When the diaper change occurred (ISO 8601 format, optional)
      required: false
      selector:
        text:

log_solids:
  name: Log Solid Food
  description: Log a solid food feeding event to Napper
  fields:
    comment:
      name: Comment
      description: Optional note about the feeding
      required: false
      selector:
        text:
    timestamp:
      name: Timestamp
      description: When the feeding occurred (ISO 8601 format, optional)
      required: false
      selector:
        text:

log_solid_food:
  name: Log Solid Food (Alias)
  description: Alias for log_solids - Log a solid food feeding event to Napper
  fields:
    comment:
